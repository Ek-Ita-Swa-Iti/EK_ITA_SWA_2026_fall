<svg xmlns="http://www.w3.org/2000/svg" width="360" height="130" viewBox="0 0 720 260" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="720" height="260" fill="#ffffff"/>

  <!-- Client -->
  <rect x="30" y="50" width="190" height="160" rx="14" fill="#e8f1fb" stroke="#2f6db5" stroke-width="2"/>
  <text x="125" y="112" text-anchor="middle" font-size="24" font-weight="bold" fill="#1d3f6b">Client</text>
  <text x="125" y="142" text-anchor="middle" font-size="15" fill="#333">curl, browser,</text>
  <text x="125" y="162" text-anchor="middle" font-size="15" fill="#333">a script</text>

  <!-- Server -->
  <rect x="500" y="50" width="190" height="160" rx="14" fill="#eaf6ec" stroke="#2e8b47" stroke-width="2"/>
  <text x="595" y="112" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e5a2e">Server</text>
  <text x="595" y="142" text-anchor="middle" font-size="15" fill="#333">api.github.com</text>

  <!-- Request -->
  <line x1="225" y1="100" x2="493" y2="100" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="360" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Request</text>
  <text x="360" y="124" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" fill="#555">GET /users/octocat</text>

  <!-- Response -->
  <line x1="495" y1="170" x2="227" y2="170" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="360" y="160" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Response</text>
  <text x="360" y="194" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" fill="#555">200 OK + JSON</text>

  <!-- Caption -->
  <text x="360" y="240" text-anchor="middle" font-size="14" font-style="italic" fill="#666">Separate programs. The only thing they share is HTTP.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="360" height="130" viewBox="0 0 720 260" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="720" height="260" fill="#ffffff"/>

  <!-- Client -->
  <rect x="30" y="50" width="190" height="160" rx="14" fill="#e8f1fb" stroke="#2f6db5" stroke-width="2"/>
  <text x="125" y="112" text-anchor="middle" font-size="24" font-weight="bold" fill="#1d3f6b">Client</text>
  <text x="125" y="142" text-anchor="middle" font-size="15" fill="#333">a browser</text>
  <text x="125" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e8b47">runs the code</text>

  <!-- Server -->
  <rect x="500" y="50" width="190" height="160" rx="14" fill="#eaf6ec" stroke="#2e8b47" stroke-width="2"/>
  <text x="595" y="122" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e5a2e">Server</text>
  <text x="595" y="150" text-anchor="middle" font-size="15" fill="#333">a web site</text>

  <!-- Response with code -->
  <line x1="495" y1="130" x2="227" y2="130" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="360" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Response with code</text>
  <text x="360" y="156" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" fill="#b5652b">&lt;script&gt; … &lt;/script&gt;</text>

  <!-- Optional tag -->
  <rect x="300" y="20" width="120" height="28" rx="14" fill="#f4f4f4" stroke="#aaa" stroke-width="1.5"/>
  <text x="360" y="39" text-anchor="middle" font-size="13" font-weight="bold" fill="#777">OPTIONAL</text>

  <!-- Caption -->
  <text x="360" y="242" text-anchor="middle" font-size="14" font-style="italic" fill="#666">The server may send code for the client to run. GitHub's API doesn't; it only sends data.</text>
</svg>

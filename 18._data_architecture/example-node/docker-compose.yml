services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DB_HOST: mysql
      DB_PASSWORD: my-secret-pw
      # Vektordatabasen ligger i skyen (Qdrant Cloud). Værdierne kommer fra .env
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-notes}
    depends_on:
      - mysql

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend

  # Sandhedskilden: her bor noterne.
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: my-secret-pw
    ports:
      - "3306:3306"

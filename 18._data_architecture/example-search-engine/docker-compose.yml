services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DB_HOST: mysql
      DB_PASSWORD: my-secret-pw
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - mysql
      - qdrant

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend

  # Sandhedskilden: her bor siderne, som tekst.
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: my-secret-pw
    ports:
      - "3306:3306"

  # Vektordatabasen: her bor siderne, som tal. Bruges kun til søgning.
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"

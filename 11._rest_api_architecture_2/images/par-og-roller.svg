<svg xmlns="http://www.w3.org/2000/svg" width="240" height="220" viewBox="0 0 480 440" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="480" height="440" fill="#ffffff"/>

  <!-- Group -->
  <rect x="10" y="34" width="460" height="400" rx="18" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="8,6"/>
  <text x="22" y="24" font-size="20" font-weight="bold" fill="#666">Gruppe</text>

  <!-- Pair A -->
  <rect x="30" y="50" width="420" height="150" rx="14" fill="#fafafa" stroke="#888" stroke-width="2"/>
  <text x="48" y="80" font-size="20" font-weight="bold" fill="#444">Par A</text>
  <rect x="50" y="95" width="170" height="85" rx="12" fill="#eaf6ec" stroke="#2e8b47" stroke-width="2"/>
  <text x="135" y="132" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e5a2e">API-ejer</text>
  <text x="135" y="158" text-anchor="middle" font-size="15" font-family="Menlo, Consolas, monospace" fill="#333">notes-service</text>
  <rect x="260" y="95" width="170" height="85" rx="12" fill="#e8f1fb" stroke="#2f6db5" stroke-width="2"/>
  <text x="345" y="145" text-anchor="middle" font-size="20" font-weight="bold" fill="#1d3f6b">Klient</text>

  <!-- Pair B -->
  <rect x="30" y="270" width="420" height="150" rx="14" fill="#fafafa" stroke="#888" stroke-width="2"/>
  <text x="48" y="300" font-size="20" font-weight="bold" fill="#444">Par B</text>
  <rect x="50" y="315" width="170" height="85" rx="12" fill="#e8f1fb" stroke="#2f6db5" stroke-width="2"/>
  <text x="135" y="365" text-anchor="middle" font-size="20" font-weight="bold" fill="#1d3f6b">Klient</text>
  <rect x="260" y="315" width="170" height="85" rx="12" fill="#eaf6ec" stroke="#2e8b47" stroke-width="2"/>
  <text x="345" y="352" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e5a2e">API-ejer</text>
  <text x="345" y="378" text-anchor="middle" font-size="15" font-family="Menlo, Consolas, monospace" fill="#333">notes-service</text>

  <!-- Calls across pairs -->
  <line x1="345" y1="182" x2="345" y2="311" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="356" y="252" font-size="16" fill="#333">kalder</text>
  <line x1="135" y1="313" x2="135" y2="184" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="124" y="252" text-anchor="end" font-size="16" fill="#333">kalder</text>
</svg>

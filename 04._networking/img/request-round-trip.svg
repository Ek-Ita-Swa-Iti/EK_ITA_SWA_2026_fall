<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#656d76"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8250df"/>
    </marker>
  </defs>

  <!-- forward arrows -->
  <line x1="174" y1="77" x2="209" y2="77" stroke="#656d76" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="364" y1="77" x2="399" y2="77" stroke="#656d76" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="554" y1="77" x2="589" y2="77" stroke="#656d76" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="744" y1="77" x2="779" y2="77" stroke="#656d76" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- step numbers -->
  <text x="192" y="64" text-anchor="middle" font-size="11" font-weight="700" fill="#0969da">1</text>
  <text x="382" y="64" text-anchor="middle" font-size="11" font-weight="700" fill="#0969da">2</text>
  <text x="572" y="64" text-anchor="middle" font-size="11" font-weight="700" fill="#0969da">3</text>
  <text x="762" y="64" text-anchor="middle" font-size="11" font-weight="700" fill="#0969da">4</text>

  <!-- return arrow -->
  <path d="M857 116 L857 165 L97 165 L97 116" fill="none" stroke="#8250df" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#p)"/>
  <text x="477" y="182" text-anchor="middle" font-size="11.5" fill="#8250df">response, back down the same connection</text>

  <!-- boxes -->
  <rect x="22" y="42" width="150" height="74" rx="8" fill="#f6f8fa" stroke="#656d76" stroke-width="1.5"/>
  <text x="97" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Client</text>
  <text x="97" y="90" text-anchor="middle" font-size="10.5" fill="#57606a">curl, a browser,</text>
  <text x="97" y="104" text-anchor="middle" font-size="10.5" fill="#57606a">another service</text>

  <rect x="212" y="42" width="150" height="74" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="287" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">DNS resolver</text>
  <text x="287" y="86" text-anchor="middle" font-size="10.5" fill="#57606a">turns the name into</text>
  <text x="287" y="100" text-anchor="middle" font-size="10.5" fill="#57606a">an IP address</text>

  <rect x="402" y="42" width="150" height="74" rx="8" fill="#f6f8fa" stroke="#656d76" stroke-width="1.5"/>
  <text x="477" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">IP address</text>
  <text x="477" y="90" text-anchor="middle" font-size="10.5" fill="#57606a">reaches the</text>
  <text x="477" y="104" text-anchor="middle" font-size="10.5" fill="#57606a">right machine</text>

  <rect x="592" y="42" width="150" height="74" rx="8" fill="#f6f8fa" stroke="#656d76" stroke-width="1.5"/>
  <text x="667" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Port :443</text>
  <text x="667" y="90" text-anchor="middle" font-size="10.5" fill="#57606a">picks the program</text>
  <text x="667" y="104" text-anchor="middle" font-size="10.5" fill="#57606a">on that machine</text>

  <rect x="782" y="42" width="150" height="74" rx="8" fill="#f6f8fa" stroke="#656d76" stroke-width="1.5"/>
  <text x="857" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Listening process</text>
  <text x="857" y="86" text-anchor="middle" font-size="10.5" fill="#57606a">handles the request,</text>
  <text x="857" y="100" text-anchor="middle" font-size="10.5" fill="#57606a">sends a reply</text>
</svg>

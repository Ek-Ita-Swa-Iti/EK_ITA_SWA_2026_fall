<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#656d76"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8250df"/>
    </marker>
  </defs>

  <!-- cards -->
  <rect x="20"  y="14" width="164" height="112" rx="10" fill="#f6f8fa" stroke="#656d76" stroke-width="1.5"/>
  <rect x="214" y="14" width="164" height="112" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <rect x="408" y="14" width="164" height="112" rx="10" fill="#f6f8fa" stroke="#656d76" stroke-width="1.5"/>
  <rect x="602" y="14" width="164" height="112" rx="10" fill="#f6f8fa" stroke="#656d76" stroke-width="1.5"/>
  <rect x="796" y="14" width="164" height="112" rx="10" fill="#f6f8fa" stroke="#656d76" stroke-width="1.5"/>

  <!-- forward arrows -->
  <line x1="186" y1="70" x2="211" y2="70" stroke="#656d76" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="380" y1="70" x2="405" y2="70" stroke="#656d76" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="574" y1="70" x2="599" y2="70" stroke="#656d76" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="768" y1="70" x2="793" y2="70" stroke="#656d76" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="199" y="61" text-anchor="middle" font-size="11" font-weight="700" fill="#0969da">1</text>
  <text x="393" y="61" text-anchor="middle" font-size="11" font-weight="700" fill="#0969da">2</text>
  <text x="587" y="61" text-anchor="middle" font-size="11" font-weight="700" fill="#0969da">3</text>
  <text x="781" y="61" text-anchor="middle" font-size="11" font-weight="700" fill="#0969da">4</text>

  <!-- return arrow -->
  <path d="M878 128 L878 158 L102 158 L102 128" fill="none" stroke="#8250df" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#p)"/>
  <text x="490" y="176" text-anchor="middle" font-size="11.5" fill="#8250df">response, back down the same connection</text>

  <!-- icon: laptop (Client) -->
  <g transform="translate(83,24)" fill="none" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="2" width="30" height="20" rx="2"/>
    <path d="M0 28 L38 28 L33 22 L5 22 Z"/>
  </g>
  <!-- icon: signpost (DNS resolver) -->
  <g transform="translate(277,24)" fill="none" stroke="#0969da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="19" y1="2" x2="19" y2="30"/>
    <path d="M19 5 L33 5 L37 9.5 L33 14 L19 14 Z"/>
    <path d="M19 17 L5 17 L1 21.5 L5 26 L19 26 Z"/>
  </g>
  <!-- icon: server rack (IP address) -->
  <g transform="translate(471,24)" fill="none" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="30" height="12" rx="2"/>
    <rect x="4" y="19" width="30" height="12" rx="2"/>
    <circle cx="9" cy="9" r="1.4" fill="#1f2328" stroke="none"/>
    <circle cx="9" cy="25" r="1.4" fill="#1f2328" stroke="none"/>
    <line x1="15" y1="9" x2="28" y2="9"/>
    <line x1="15" y1="25" x2="28" y2="25"/>
  </g>
  <!-- icon: door (Port :443) -->
  <g transform="translate(665,24)" fill="none" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 3 L9 31 L29 31 L29 3 Z"/>
    <line x1="4" y1="31" x2="34" y2="31"/>
    <circle cx="24.5" cy="17" r="1.6" fill="#1f2328" stroke="none"/>
  </g>
  <!-- icon: gear (Listening process) -->
  <g transform="translate(859,24)" fill="none" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="19" cy="17" r="8.5"/>
    <circle cx="19" cy="17" r="3"/>
    <line x1="19" y1="3"   x2="19" y2="7"/>
    <line x1="19" y1="27"  x2="19" y2="31"/>
    <line x1="5"  y1="17"  x2="9"  y2="17"/>
    <line x1="29" y1="17"  x2="33" y2="17"/>
    <line x1="9.1"  y1="7.1"  x2="11.9" y2="9.9"/>
    <line x1="26.1" y1="24.1" x2="28.9" y2="26.9"/>
    <line x1="28.9" y1="7.1"  x2="26.1" y2="9.9"/>
    <line x1="11.9" y1="24.1" x2="9.1"  y2="26.9"/>
  </g>

  <!-- labels -->
  <text x="102" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Client</text>
  <text x="102" y="99" text-anchor="middle" font-size="10.5" fill="#57606a">curl, a browser,</text>
  <text x="102" y="113" text-anchor="middle" font-size="10.5" fill="#57606a">another service</text>

  <text x="296" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">DNS resolver</text>
  <text x="296" y="99" text-anchor="middle" font-size="10.5" fill="#57606a">turns a name into</text>
  <text x="296" y="113" text-anchor="middle" font-size="10.5" fill="#57606a">an IP address</text>

  <text x="490" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">IP address</text>
  <text x="490" y="99" text-anchor="middle" font-size="10.5" fill="#57606a">reaches the</text>
  <text x="490" y="113" text-anchor="middle" font-size="10.5" fill="#57606a">right machine</text>

  <text x="684" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Port :443</text>
  <text x="684" y="99" text-anchor="middle" font-size="10.5" fill="#57606a">picks the program</text>
  <text x="684" y="113" text-anchor="middle" font-size="10.5" fill="#57606a">on that machine</text>

  <text x="878" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Listening process</text>
  <text x="878" y="99" text-anchor="middle" font-size="10.5" fill="#57606a">handles it,</text>
  <text x="878" y="113" text-anchor="middle" font-size="10.5" fill="#57606a">sends a reply</text>
</svg>
